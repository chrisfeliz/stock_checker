name: Airbnb availability check (every 6 hours)

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, at :17
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Add randomized delay
        run: |
          delay="$((RANDOM % 900))"
          echo "Sleeping for ${delay}s to jitter request timing"
          sleep "$delay"

      - name: Check Airbnb availability
        id: run
        env:
          LISTING_URL: "https://www.airbnb.com/rooms/1693855865772640392"
          CHECKIN_DATE: "2026-10-09"
          NIGHTS: "1"
        run: |
          python check_stock.py | tee stock_status.txt
          {
            echo "line<<EOF"
            tail -n 1 stock_status.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send email alert when the stay is available
        if: contains(steps.run.outputs.line, 'status=AVAILABLE')
        env:
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_RECEIVER: ${{ secrets.SMTP_RECEIVER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ALERT_SUBJECT: "AVAILABLE: Airbnb stay starting October 9"
          ALERT_BODY: |
            The requested Airbnb stay appears to be available.

            Listing:
            https://www.airbnb.com/rooms/1693855865772640392

            Requested stay: October 9–10, 2026

            Latest check output:
            ${{ steps.run.outputs.line }}
        run: |
          python send_email.py
